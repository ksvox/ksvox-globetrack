<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Music Radar v2.1</title>
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f172a; color: #f8fafc; }
    header { background: #1e293b; padding: 15px 20px; text-align: center; border-bottom: 2px solid #38bdf8; }
    h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 5px; }

    /* ニュースティッカー */
    .news-container { background: #0284c7; padding: 8px 15px; overflow: hidden; white-space: nowrap; font-size: 0.9rem; }
    .news-ticker { display: inline-block; animation: ticker 35s linear infinite; }
    .news-ticker a { color: #ffffff; text-decoration: underline; margin-right: 40px; font-weight: bold; }
    @keyframes ticker { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

    /* メインレイアウト */
    .main-layout { display: grid; grid-template-columns: 1fr 340px; gap: 15px; padding: 15px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } }

    /* 地図セクション */
    .map-section { background: #1e293b; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    #map { height: 480px; width: 100%; border-radius: 8px; z-index: 1; }

    /* Billboard トップ20エリア */
    .billboard-container { background: #0f172a; border-radius: 8px; padding: 15px; }
    .nav-buttons { display: flex; gap: 10px; margin-bottom: 12px; }
    .nav-btn { background: #334155; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .nav-btn.active, .nav-btn:hover { background: #38bdf8; color: #0f172a; }
    .chart-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; max-height: 380px; overflow-y: auto; padding-right: 5px; }
    .chart-item { display: flex; align-items: center; gap: 10px; background: #1e293b; padding: 8px; border-radius: 6px; }
    .chart-rank { font-weight: bold; font-size: 1.1rem; color: #38bdf8; min-width: 25px; text-align: center; }
    .chart-img { width: 48px; height: 48px; border-radius: 4px; object-fit: cover; background: #334155; }
    .chart-info { overflow: hidden; }
    .chart-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fff; }
    .chart-artist { font-size: 0.75rem; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* サイドバー（Spotifyプレイリスト） */
    .sidebar { background: #1e293b; border-radius: 10px; padding: 15px; display: flex; flex-direction: column; gap: 15px; }
    .sidebar-title { font-size: 1.1rem; color: #1db954; font-weight: bold; border-bottom: 1px solid #334155; padding-bottom: 8px; }
    .spotify-widget { width: 100%; height: 520px; border: none; border-radius: 12px; }
  </style>
</head>
<body>

  <header>
    <h1>🌍 Global Music Radar v2.1</h1>
  </header>

  <!-- 洋楽ニュースティッカー -->
  <div class="news-container">
    <div class="news-ticker" id="newsTicker">ニュースを読み込み中...</div>
  </div>

  <div class="main-layout">
    <!-- 左側：地図とBillboardトップ20 -->
    <div class="map-section">
      <div id="map"></div>

      <div class="billboard-container">
        <div class="nav-buttons">
          <button class="nav-btn active" onclick="loadBillboard('US', this)">🇺🇸 アメリカ Hot 20</button>
          <button class="nav-btn" onclick="loadBillboard('GB', this)">🇬🇧 イギリス Top 20</button>
          <button class="nav-btn" onclick="loadBillboard('JP', this)">🇯🇵 日本 Top 20</button>
        </div>
        <div class="chart-list" id="chartList">読み込み中...</div>
      </div>
    </div>

    <!-- 右側：Spotify プレイリスト -->
    <div class="sidebar">
      <div class="sidebar-title">🎵 おすすめ Spotify プレイリスト</div>
      <!-- ※ご自身のプレイリストIDに変更する場合は embed/playlist/ の後ろの文字列を差し替えてください -->
      <iframe class="spotify-widget" 
        src="https://open.spotify.com/embed/playlist/37i9dQZF1DXcBWIGoYBM5M?utm_source=generator&theme=0" 
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
        loading="lazy">
      </iframe>
    </div>
  </div>

  <script>
    // --- 1. 地図初期化 ---
    const map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap &copy; CARTO',
      maxZoom: 18
    }).addTo(map);

    // 国別の代表ピンデータ
    const countries = [
      { name: 'アメリカ', code: 'US', lat: 37.0902, lng: -95.7129 },
      { name: 'イギリス', code: 'GB', lat: 55.3781, lng: -3.4360 },
      { name: '日本', code: 'JP', lat: 36.2048, lng: 138.2529 },
      { name: 'ブラジル', code: 'BR', lat: -14.2350, lng: -51.9253 },
      { name: 'フランス', code: 'FR', lat: 46.2276, lng: 2.2137 },
      { name: 'オーストラリア', code: 'AU', lat: -25.2744, lng: 133.7751 }
    ];

    // 各国1位曲の独立取得（Billboard処理と分離してフリーズを防止）
    countries.forEach(country => {
      const marker = L.marker([country.lat, country.lng]).addTo(map);
      marker.bindPopup(`<b>${country.name}</b><br>取得中...`);

      fetch(`https://itunes.apple.com/${country.code.toLowerCase()}/rss/topsongs/limit=1/json`)
        .then(res => res.json())
        .then(data => {
          const entry = data.feed.entry[0];
          const title = entry['im:name'].label;
          const artist = entry['im:artist'].label;
          const img = entry['im:image'][2].label;
          
          marker.setPopupContent(`
            <div style="text-align:center; color:#0f172a;">
              <strong style="font-size:1.0rem;">${country.name} 1位</strong><br>
              <img src="${img}" style="width:70px; height:70px; border-radius:6px; margin:5px 0;"><br>
              <b>${title}</b><br>
              <small>${artist}</small>
            </div>
          `);
        })
        .catch(() => {
          marker.setPopupContent(`<b>${country.name}</b><br>データ取得失敗`);
        });
    });

    // --- 2. Billboard Hot 20（上位20曲＆正しく jackets 表示）---
    function loadBillboard(countryCode, btn) {
      if (btn) {
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }

      const chartList = document.getElementById('chartList');
      chartList.innerHTML = '読み込み中...';

      fetch(`https://itunes.apple.com/${countryCode.toLowerCase()}/rss/topsongs/limit=20/json`)
        .then(res => res.json())
        .then(data => {
          const entries = data.feed.entry || [];
          chartList.innerHTML = '';

          entries.forEach((entry, index) => {
            const title = entry['im:name'].label;
            const artist = entry['im:artist'].label;
            // 高解像度サムネイルを取得
            const img = entry['im:image'][2].label.replace('170x170bb', '300x300bb');

            const item = document.createElement('div');
            item.className = 'chart-item';
            item.innerHTML = `
              <div class="chart-rank">${index + 1}</div>
              <img class="chart-img" src="${img}" alt="${title}" loading="lazy">
              <div class="chart-info">
                <div class="chart-title">${title}</div>
                <div class="chart-artist">${artist}</div>
              </div>
            `;
            chartList.appendChild(item);
          });
        })
        .catch(err => {
          chartList.innerHTML = '<div style="color:#ef4444;">ランキングデータの取得に失敗しました。</div>';
        });
    }

    // 初回読み込み（アメリカ Hot 20）
    loadBillboard('US');

    // --- 3. 洋楽ニュース RSS取得（リンク付き）---
    function loadNews() {
      const rssUrl = encodeURIComponent('https://www.billboard.com/c/music/music-news/feed/');
      fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`)
        .then(res => res.json())
        .then(data => {
          if (data.status === 'ok') {
            const items = data.items.slice(0, 8);
            const tickerHtml = items.map(item => 
              `<a href="${item.link}" target="_blank" rel="noopener noreferrer">📰 ${item.title}</a>`
            ).join('');
            document.getElementById('newsTicker').innerHTML = tickerHtml;
          }
        })
        .catch(() => {
          document.getElementById('newsTicker').innerHTML = 'ニュースの取得に失敗しました。';
        });
    }
    loadNews();
  </script>
</body>
</html>
