<!DOCTYPE html>
<html lang="ja" class="dark h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>世界で“今”聴かれてる曲は？ - World Sound Chart</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{spotify:{green:'#1DB954',black:'#121212'}},fontFamily:{sans:['Plus Jakarta Sans','sans-serif']}}}}
</script>
<style>
body,html{touch-action:manipulation;overscroll-behavior:none;overflow:hidden;height:100%;width:100%;margin:0;background:#121212;-webkit-tap-highlight-color:transparent}
#map-wrapper{position:relative;width:100%;flex:1 1 auto;min-height:200px;background:#121212;overflow:hidden}
#map{width:100%;height:100%;background:#121212}
.leaflet-container{background:#121212!important;font-family:'Plus Jakarta Sans',sans-serif!important}
@keyframes marquee{0%{transform:translateX(0%)}100%{transform:translateX(-50%)}}
.animate-marquee{display:inline-flex;white-space:nowrap;animation:marquee 45s linear infinite}
.animate-marquee:hover{animation-play-state:paused}
@keyframes pulse-glow{0%,100%{transform:scale(0.95);opacity:0.85}50%{transform:scale(1.05);opacity:1}}
.pulse-glow-pin{animation:pulse-glow 2.2s infinite ease-in-out}
.bottom-sheet{transition:transform .35s cubic-bezier(.16,1,.3,1);will-change:transform;z-index:1000!important}
.bottom-sheet.closed{transform:translateY(105%)!important}
.bottom-sheet.open{transform:translateY(0)!important}
.rank-1{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;font-weight:800}
.rank-2{background:linear-gradient(135deg,#E0E0E0,#9E9E9E);color:#000;font-weight:800}
.rank-3{background:linear-gradient(135deg,#CD7F32,#8B4513);color:#fff;font-weight:800}
.rank-other{background:#282828;color:#b3b3b3}
.leaflet-div-icon{background:transparent!important;border:none!important}
.speech-bubble{box-shadow:0 4px 15px rgba(0,0,0,.7);backdrop-filter:blur(8px)}
.no-scrollbar::-webkit-scrollbar{display:none}
.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
</style>
</head>
<body class="bg-spotify-black text-white select-none font-sans h-full w-full">
<div class="flex flex-col h-full w-full max-w-md mx-auto relative bg-spotify-black border-x border-zinc-900 shadow-2xl overflow-hidden">
  
  <!-- ヘッダー -->
  <header class="pt-3 px-4 pb-2 bg-black/90 z-20 flex flex-col space-y-0.5 shrink-0 border-b border-zinc-800/60">
    <div class="flex items-center space-x-1.5 text-spotify-green">
      <i class="fa-solid fa-globe text-xs"></i>
      <span class="text-[11px] font-bold tracking-wider uppercase">World Sound Chart</span>
    </div>
    <h1 class="text-base font-extrabold tracking-tight text-white">世界で“今”聴かれてる曲は？</h1>
  </header>

  <!-- Billboard ボタン -->
  <div class="px-2.5 py-2 z-20 flex items-center space-x-2 overflow-x-auto shrink-0 bg-black/80 border-b border-zinc-800">
    <button onclick="fetchChart('US','billboard','Billboard Hot 20',20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-amber-500/50 text-xs font-bold hover:border-amber-400 active:scale-95 transition-all cursor-pointer">🇺🇸 米 Billboard 20</button>
    <button onclick="fetchChart('GB','billboard','Billboard Hot 20',20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-blue-500/50 text-xs font-bold hover:border-blue-400 active:scale-95 transition-all cursor-pointer">🇬🇧 英 Billboard 20</button>
    <button onclick="fetchChart('JP','billboard','Billboard Hot 20',20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-red-500/50 text-xs font-bold hover:border-red-400 active:scale-95 transition-all cursor-pointer">🇯🇵 日 Billboard 20</button>
  </div>

  <!-- ニュースティッカー -->
  <div class="z-20 bg-zinc-950/90 border-b border-zinc-800/80 py-1.5 px-3 overflow-hidden flex items-center shrink-0">
    <div class="flex items-center space-x-1 bg-spotify-green/20 text-spotify-green px-1.5 py-0.5 rounded text-[10px] font-bold uppercase mr-2 shrink-0">
      <i class="fa-solid fa-bolt text-[9px]"></i><span>NEWS</span>
    </div>
    <div class="overflow-hidden whitespace-nowrap flex-1 text-xs text-zinc-300">
      <span id="news-ticker-text" class="animate-marquee inline-block"><span>🎵 ニュース読み込み中... &nbsp;&nbsp;&nbsp;&nbsp;</span></span>
    </div>
  </div>

  <!-- Spotify プレイリスト・スライドショー -->
  <div class="z-20 bg-zinc-900/90 border-b border-zinc-800 py-2 px-3 shrink-0 relative">
    <div class="flex items-center justify-between mb-1.5">
      <span class="text-[10px] font-bold text-spotify-green uppercase tracking-wider flex items-center space-x-1">
        <i class="fa-brands fa-spotify"></i><span>K's VOX Recommended Playlists</span>
      </span>
      <div class="flex space-x-1">
        <button onclick="scrollPlaylist(-1)" class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 hover:text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-chevron-left"></i></button>
        <button onclick="scrollPlaylist(1)" class="w-5 h-5 rounded-full bg-zinc-800 text-zinc-300 hover:text-white flex items-center justify-center text-[10px]"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>
    <div id="playlist-slider" class="flex space-x-2.5 overflow-x-auto no-scrollbar scroll-smooth py-1">
      <div class="text-xs text-zinc-500 py-2">プレイリストを読み込み中...</div>
    </div>
  </div>

  <!-- 地図 -->
  <div id="map-wrapper"><div id="map"></div></div>

  <!-- フッター -->
  <footer class="z-20 bg-black/90 py-2 px-3 text-center border-t border-zinc-900 text-[11px] text-zinc-400 shrink-0">
    提供：<a href="https://www.ksvox.net" target="_blank" rel="noopener noreferrer" class="text-spotify-green hover:underline font-bold">ボーカル道場K's VOX <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>
  </footer>

  <!-- ボトムシート -->
  <div id="ranking-sheet" class="bottom-sheet closed fixed inset-x-0 bottom-0 h-[78%] max-w-md mx-auto bg-zinc-950/95 border-t border-zinc-800 rounded-t-3xl shadow-2xl flex flex-col backdrop-blur-2xl">
    <div id="sheet-handle" class="w-full py-3 flex justify-center items-center cursor-pointer">
      <div class="w-12 h-1.5 rounded-full bg-zinc-700"></div>
    </div>
    <div class="px-5 pb-3 flex items-center justify-between border-b border-zinc-800 shrink-0">
      <div class="flex items-center space-x-2">
        <span id="sheet-flag" class="text-2xl">🇺🇸</span>
        <h2 id="sheet-title" class="text-base font-bold text-white">今聴かれている曲 Top 10</h2>
      </div>
      <button id="close-sheet-btn" type="button" aria-label="閉じる" class="w-8 h-8 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white flex items-center justify-center transition-colors active:scale-95 cursor-pointer">
        <i class="fa-solid fa-xmark text-base"></i>
      </button>
    </div>
    <div id="song-list-container" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>
  </div>
</div>

<script>
const COUNTRIES={'US':{name:'アメリカ',flag:'🇺🇸',coords:[38.0,-97.0],topSong:'読み込み中...',offsetX:0,offsetY:-35},'GB':{name:'イギリス',flag:'🇬🇧',coords:[55.0,-3.5],topSong:'読み込み中...',offsetX:-30,offsetY:-45},'FR':{name:'フランス',flag:'🇫🇷',coords:[46.2,2.2],topSong:'読み込み中...',offsetX:-45,offsetY:15},'DE':{name:'ドイツ',flag:'🇩🇪',coords:[51.1,10.4],topSong:'読み込み中...',offsetX:40,offsetY:-35},'JP':{name:'日本',flag:'🇯🇵',coords:[36.2,138.2],topSong:'読み込み中...',offsetX:40,offsetY:-25},'KR':{name:'韓国',flag:'🇰🇷',coords:[35.9,127.7],topSong:'読み込み中...',offsetX:-45,offsetY:20},'BR':{name:'ブラジル',flag:'🇧🇷',coords:[-14.2,-51.9],topSong:'読み込み中...',offsetX:0,offsetY:15},'AU':{name:'豪州',flag:'🇦🇺',coords:[-25.2,133.7],topSong:'読み込み中...',offsetX:0,offsetY:15}};
let map=null;
const openSheet=()=>document.getElementById('ranking-sheet').classList.replace('closed','open');
const closeSheet=()=>document.getElementById('ranking-sheet').classList.replace('open','closed');

async function fetchMusicNews(){
  const feeds=[{name:'NME',url:'https://nme-jp.com/feed/'},{name:'BARKS',url:'https://www.barks.jp/news/rss/rss.xml'},{name:'MusicLife',url:'https://www.musiclifeclub.com/rss.xml'}];
  const tickerEl=document.getElementById('news-ticker-text');
  const items=[];
  await Promise.allSettled(feeds.map(async(f)=>{
    try{
      const res=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(f.url)}`);
      if(res.ok){
        const data=await res.json();
        if(data.status==='ok'&&data.items){
          data.items.slice(0,3).forEach(i=>{
            items.push(`📰 <a href="${escapeHtml(i.link)}" target="_blank" rel="noopener noreferrer" class="hover:underline hover:text-spotify-green">[${f.name}] ${escapeHtml(i.title)}</a>`);
          });
        }
      }
    }catch(e){}
  }));
  if(items.length){
    items.sort(()=>Math.random()-0.5);
    const headlines=items.join(' &nbsp;&nbsp;&nbsp;&nbsp; ');
    tickerEl.innerHTML=`<span>${headlines} &nbsp;&nbsp;&nbsp;&nbsp;</span><span>${headlines} &nbsp;&nbsp;&nbsp;&nbsp;</span>`;
  }else{
    tickerEl.innerHTML=`<span>🎵 洋楽・来日公演・新作情報を更新中！ &nbsp;&nbsp;&nbsp;&nbsp;</span>`;
  }
}

async function fetchPlaylists(){
  const slider=document.getElementById('playlist-slider');
  try{
    const res=await fetch('/api/chart?type=playlists');
    if(res.ok){
      const data=await res.json();
      if(data.playlists&&data.playlists.length>0){
        slider.innerHTML=data.playlists.map(p=>`
          <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="flex-none w-48 bg-zinc-800/80 hover:bg-zinc-800 border border-zinc-700/50 rounded-xl p-2 flex items-center space-x-2.5 transition-all group">
            <img src="${p.img||'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=100'}" class="w-10 h-10 rounded-lg object-cover bg-zinc-900 shrink-0"/>
            <div class="min-w-0 flex-1">
              <h4 class="text-xs font-bold text-white truncate group-hover:text-spotify-green transition-colors">${escapeHtml(p.name)}</h4>
              <p class="text-[10px] text-zinc-400 truncate"><i class="fa-solid fa-music text-[9px] mr-1"></i>${p.tracksCount}曲</p>
            </div>
          </a>`).join('');
        startPlaylistAutoScroll();
        return;
      }
    }
  }catch(e){}
  slider.innerHTML=`<div class="text-xs text-zinc-500 py-1">プレイリストを取得できませんでした</div>`;
}

function scrollPlaylist(direction){
  document.getElementById('playlist-slider').scrollBy({left:direction*200,behavior:'smooth'});
}

function startPlaylistAutoScroll(){
  const slider=document.getElementById('playlist-slider');
  setInterval(()=>{
    if(slider.matches(':hover'))return;
    if(slider.scrollLeft+slider.clientWidth>=slider.scrollWidth){
      slider.scrollTo({left:0,behavior:'smooth'});
    }else{
      slider.scrollBy({left:200,behavior:'smooth'});
    }
  },4000);
}

function initMap(){
  if(map||typeof L==='undefined')return;
  const bounds=L.latLngBounds(L.latLng(-70,-180),L.latLng(85,180));
  map=L.map('map',{zoomControl:false,attributionControl:false,minZoom:1,maxZoom:7,maxBounds:bounds,maxBoundsViscosity:1.0});
  L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:16,noWrap:true,bounds}).addTo(map);
  map.fitBounds(L.latLngBounds(L.latLng(-50,-130),L.latLng(65,150)),{padding:[10,10]});

  Object.keys(COUNTRIES).forEach(code=>{
    const c=COUNTRIES[code];
    const iconHtml=`<div class="relative flex flex-col items-center cursor-pointer">
      <div class="speech-bubble px-2 py-1 rounded-lg bg-zinc-900/95 border border-spotify-green text-[9px] font-bold text-white mb-1 whitespace-nowrap flex items-center space-x-1" style="transform:translate(${c.offsetX}px,${c.offsetY}px);">
        <span>${c.flag}</span><span class="text-spotify-green font-extrabold">1位:</span>
        <span id="bubble-song-${code}" class="truncate max-w-[65px]">${escapeHtml(c.topSong)}</span>
      </div>
      <div class="w-5 h-5 rounded-full bg-spotify-green/30 border-2 border-spotify-green pulse-glow-pin flex items-center justify-center -mt-2">
        <div class="w-2 h-2 rounded-full bg-spotify-green"></div>
      </div>
    </div>`;
    L.marker(c.coords,{icon:L.divIcon({html:iconHtml,className:'',iconSize:[80,40],iconAnchor:[40,20]})}).addTo(map).on('click',()=>fetchChart(code,'now','今聴かれている曲 Top 10',10));
  });
  setTimeout(()=>{if(map)map.invalidateSize();},300);
  preloadTopSongs();
}

async function preloadTopSongs(){
  Object.keys(COUNTRIES).forEach(async(code)=>{
    try{
      const res=await fetch(`/api/chart?country=${code}&chartType=now&limit=1`);
      if(res.ok){
        const data=await res.json();
        if(data.tracks?.[0])updateBubbleSong(code,data.tracks[0].title);
      }
    }catch(e){}
  });
}

function updateBubbleSong(code,title){
  if(COUNTRIES[code])COUNTRIES[code].topSong=title;
  const el=document.getElementById(`bubble-song-${code}`);
  if(el)el.textContent=title;
}

async function fetchChart(code,chartType='now',displayTitle='',limit=10){
  const country=COUNTRIES[code]||COUNTRIES['US'];
  document.getElementById('sheet-flag').textContent=country.flag;
  document.getElementById('sheet-title').textContent=`${country.name} ${displayTitle}`;
  openSheet();
  const container=document.getElementById('song-list-container');
  container.innerHTML=`<div class="flex items-center justify-center py-12 space-x-2"><div class="w-6 h-6 border-2 border-spotify-green border-t-transparent rounded-full animate-spin"></div><span class="text-xs text-zinc-400">取得中...</span></div>`;

  try{
    const res=await fetch(`/api/chart?country=${code}&chartType=${chartType}&limit=${limit}`);
    if(res.ok){
      const data=await res.json();
      if(data.tracks?.length){
        updateBubbleSong(code,data.tracks[0].title);
        renderTracks(data.tracks);
        return;
      }
    }
  }catch(e){}
}

function renderTracks(tracks){
  const container=document.getElementById('song-list-container');
  container.innerHTML=tracks.map((t,idx)=>{
    const rank=t.rank||(idx+1);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300"><rect width="300" height="300" fill="#181818"/><circle cx="150" cy="150" r="100" fill="#1DB954"/><text x="150" y="165" font-size="48" fill="#fff" text-anchor="middle">No.${rank}</text></svg>`;
    const fallbackImg='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    return `<div class="flex items-center justify-between p-2.5 rounded-xl bg-zinc-900 border border-zinc-800/80">
      <div class="flex items-center space-x-3 min-w-0 flex-1">
        <span class="w-6 h-6 rounded flex items-center justify-center text-xs font-extrabold shrink-0 ${rank<=3?'rank-'+rank:'rank-other'}">${rank}</span>
        <img src="${t.img||fallbackImg}" onerror="this.src='${fallbackImg}';" class="w-10 h-10 rounded-lg object-cover bg-zinc-800 shrink-0"/>
        <div class="min-w-0 flex-1">
          <h4 class="text-xs font-bold text-white truncate">${escapeHtml(t.title)}</h4>
          <p class="text-[11px] text-zinc-400 truncate">${escapeHtml(t.artist)}</p>
        </div>
      </div>
      <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-full bg-spotify-green/20 text-spotify-green hover:bg-spotify-green hover:text-black transition-colors flex items-center justify-center text-xs ml-2 shrink-0"><i class="fa-solid fa-play"></i></a>
    </div>`;
  }).join('');
}

const escapeHtml=(str)=>String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

window.addEventListener('load',()=>{
  initMap();
  fetchMusicNews();
  fetchPlaylists();
  document.getElementById('close-sheet-btn').addEventListener('click',closeSheet);
  document.getElementById('sheet-handle').addEventListener('click',closeSheet);
});
window.addEventListener('resize',()=>{if(map)map.invalidateSize();});
</script>
</body>
</html>
