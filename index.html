<!DOCTYPE html>
<html lang="ja" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>世界で“今”聴かれてる曲は？ - World Sound Chart</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            green: '#1DB954',
                            darkGreen: '#1aa34a',
                            black: '#121212',
                            card: '#181818',
                            hover: '#282828',
                            lightText: '#b3b3b3'
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body, html {
            touch-action: manipulation;
            overscroll-behavior: none;
            overflow: hidden;
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background-color: #121212;
            -webkit-tap-highlight-color: transparent;
        }

        #map-wrapper {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 250px;
            background-color: #121212;
            overflow: hidden;
        }

        #map {
            width: 100%;
            height: 100%;
            background-color: #121212;
        }

        .leaflet-container {
            background: #121212 !important;
            font-family: 'Plus Jakarta Sans', sans-serif !important;
        }

        @keyframes marquee {
            0% { transform: translateX(0%); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            display: inline-flex;
            white-space: nowrap;
            animation: marquee 30s linear infinite;
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.95); opacity: 0.85; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.85; }
        }
        .pulse-glow-pin {
            animation: pulse-glow 2.2s infinite ease-in-out;
        }

        /* ボトムシート：画面最前面（z-[1000]）に滑らかにせり上がる設定 */
        .bottom-sheet {
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: transform;
            z-index: 1000 !important;
        }
        .bottom-sheet.closed { transform: translateY(105%) !important; }
        .bottom-sheet.open { transform: translateY(0) !important; }

        .rank-1 { background: linear-gradient(135deg, #FFD700, #FFA500); color: #000; font-weight: 800; }
        .rank-2 { background: linear-gradient(135deg, #E0E0E0, #9E9E9E); color: #000; font-weight: 800; }
        .rank-3 { background: linear-gradient(135deg, #CD7F32, #8B4513); color: #fff; font-weight: 800; }
        .rank-other { background: #282828; color: #b3b3b3; }

        .leaflet-div-icon {
            background: transparent !important;
            border: none !important;
        }

        .speech-bubble {
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-spotify-black text-white select-none font-sans h-full w-full">

    <div class="flex flex-col h-full w-full max-w-md mx-auto relative bg-spotify-black border-x border-zinc-900 shadow-2xl overflow-hidden">
        
        <!-- Header -->
        <header class="pt-3 px-4 pb-2 bg-black/90 z-20 flex flex-col space-y-0.5 shrink-0 border-b border-zinc-800/60">
            <div class="flex items-center space-x-1.5 text-spotify-green">
                <i class="fa-solid fa-globe text-xs"></i>
                <span class="text-[11px] font-bold tracking-wider uppercase">World Sound Chart</span>
            </div>
            <h1 class="text-base font-extrabold tracking-tight text-white">
                世界で“今”聴かれてる曲は？
            </h1>
        </header>

        <!-- 主要3カ国 Billboard Hot 20 ボタン -->
        <div class="px-2.5 py-2 z-20 flex items-center space-x-2 overflow-x-auto shrink-0 bg-black/80 border-b border-zinc-800">
            <button onclick="fetchChart('US', 'billboard', '🇺🇸 アメリカ Billboard Hot 20', 20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-amber-500/50 text-xs font-bold text-white flex items-center justify-center space-x-1 hover:border-amber-400 active:scale-95 transition-all cursor-pointer">
                <span>🇺🇸 米 Billboard 20</span>
            </button>
            <button onclick="fetchChart('GB', 'billboard', '🇬🇧 イギリス Billboard Hot 20', 20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-blue-500/50 text-xs font-bold text-white flex items-center justify-center space-x-1 hover:border-blue-400 active:scale-95 transition-all cursor-pointer">
                <span>🇬🇧 英 Billboard 20</span>
            </button>
            <button onclick="fetchChart('JP', 'billboard', '🇯🇵 日本 Billboard Hot 20', 20)" class="flex-1 min-w-[100px] px-2 py-1.5 rounded-xl bg-zinc-900 border border-red-500/50 text-xs font-bold text-white flex items-center justify-center space-x-1 hover:border-red-400 active:scale-95 transition-all cursor-pointer">
                <span>🇯🇵 日 Billboard 20</span>
            </button>
        </div>

        <!-- 地図表示エリア -->
        <div id="map-wrapper">
            <div id="map"></div>
        </div>

        <!-- NEWS -->
        <div class="z-20 bg-zinc-950 border-t border-zinc-800 py-1.5 px-3 overflow-hidden flex items-center shrink-0">
            <div class="flex items-center space-x-1 bg-spotify-green/20 text-spotify-green px-1.5 py-0.5 rounded text-[10px] font-bold uppercase mr-2 shrink-0">
                <i class="fa-solid fa-bolt text-[9px]"></i>
                <span>NOW</span>
            </div>
            <div class="overflow-hidden whitespace-nowrap flex-1 text-xs text-zinc-300">
                <span id="news-ticker-text" class="animate-marquee inline-block">
                    <span>🎵 Spotify Realtime Hits &nbsp;&nbsp;&nbsp;&nbsp; 🎵 地図上の国をタップして今聴かれている曲をチェック &nbsp;&nbsp;&nbsp;&nbsp;</span>
                    <span>🎵 Spotify Realtime Hits &nbsp;&nbsp;&nbsp;&nbsp; 🎵 地図上の国をタップして今聴かれている曲をチェック &nbsp;&nbsp;&nbsp;&nbsp;</span>
                </span>
            </div>
        </div>

        <!-- クレジット -->
        <footer class="z-20 bg-black/90 py-2 px-3 text-center border-t border-zinc-900 text-[11px] text-zinc-400 shrink-0">
            提供：<a href="https://www.ksvox.net" target="_blank" rel="noopener noreferrer" class="text-spotify-green hover:underline font-bold">ボーカル道場K's VOX <i class="fa-solid fa-arrow-up-right-from-square text-[9px]"></i></a>
        </footer>

        <!-- ランキング ボトムシート（最前面 z-[1000] に配置） -->
        <div id="ranking-sheet" class="bottom-sheet closed fixed inset-x-0 bottom-0 h-[78%] max-w-md mx-auto bg-zinc-950/95 border-t border-zinc-800 rounded-t-3xl shadow-2xl flex flex-col backdrop-blur-2xl">
            <div id="sheet-handle" class="w-full py-3 flex justify-center items-center cursor-pointer">
                <div class="w-12 h-1.5 rounded-full bg-zinc-700"></div>
            </div>

            <div class="px-5 pb-3 flex items-center justify-between border-b border-zinc-800 shrink-0">
                <div class="flex items-center space-x-2">
                    <span id="sheet-flag" class="text-2xl">🇺🇸</span>
                    <h2 id="sheet-title" class="text-base font-bold text-white">今聴かれている曲 Top 10</h2>
                </div>
                <button id="close-sheet-btn" type="button" aria-label="閉じる" class="w-8 h-8 rounded-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 hover:text-white flex items-center justify-center transition-colors active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-xmark text-base"></i>
                </button>
            </div>

            <div id="song-list-container" class="flex-1 overflow-y-auto px-4 py-3 space-y-2"></div>
        </div>

    </div>

    <script>
        const COUNTRIES = {
            'US': { name: 'アメリカ', flag: '🇺🇸', coords: [38.0, -97.0], topSong: 'A Bar Song', offsetX: 0, offsetY: -35 },
            'GB': { name: 'イギリス', flag: '🇬🇧', coords: [55.0, -3.5], topSong: 'Espresso', offsetX: -30, offsetY: -45 },
            'FR': { name: 'フランス', flag: '🇫🇷', coords: [46.2, 2.2], topSong: 'Imagine', offsetX: -45, offsetY: 15 },
            'DE': { name: 'ドイツ', flag: '🇩🇪', coords: [51.1, 10.4], topSong: 'Wunder', offsetX: 40, offsetY: -35 },
            'JP': { name: '日本', flag: '🇯🇵', coords: [36.2, 138.2], topSong: 'ライラック', offsetX: 40, offsetY: -25 },
            'KR': { name: '韓国', flag: '🇰🇷', coords: [35.9, 127.7], topSong: 'Supernova', offsetX: -45, offsetY: 20 },
            'BR': { name: 'ブラジル', flag: '🇧🇷', coords: [-14.2, -51.9], topSong: 'MTG Quem', offsetX: 0, offsetY: 15 },
            'AU': { name: '豪州', flag: '🇦🇺', coords: [-25.2, 133.7], topSong: 'Birds of a Feather', offsetX: 0, offsetY: 15 }
        };

        let map = null;

        function openSheet() {
            const sheet = document.getElementById('ranking-sheet');
            sheet.classList.remove('closed');
            sheet.classList.add('open');
        }

        function closeSheet() {
            const sheet = document.getElementById('ranking-sheet');
            sheet.classList.remove('open');
            sheet.classList.add('closed');
        }

        function initMap() {
            if (map || typeof L === 'undefined') return;

            // 地図が反復ループしないよう東西南北の境界領域（bounds）を設定
            const worldBounds = L.latLngBounds(L.latLng(-70, -180), L.latLng(85, 180));

            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                minZoom: 1,
                maxZoom: 7,
                maxBounds: worldBounds,
                maxBoundsViscosity: 1.0,
                worldCopyJump: false
            });

            // noWrap: true で地図タイルが横ループしない1枚表示に固定
            L.tileLayer('https://services.arcgisonline.com/arcgis/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxZoom: 16,
                noWrap: true,
                bounds: worldBounds
            }).addTo(map);

            const displayBounds = L.latLngBounds(L.latLng(-50, -130), L.latLng(65, 150));
            map.fitBounds(displayBounds, { padding: [10, 10] });

            Object.keys(COUNTRIES).forEach(code => {
                const country = COUNTRIES[code];
                
                const iconHtml = `
                    <div class="relative flex flex-col items-center cursor-pointer group">
                        <div class="speech-bubble px-2 py-1 rounded-lg bg-zinc-900/95 border border-spotify-green text-[9px] font-bold text-white mb-1 whitespace-nowrap flex items-center space-x-1"
                             style="transform: translate(${country.offsetX}px, ${country.offsetY}px);">
                            <span>${country.flag}</span>
                            <span class="text-spotify-green font-extrabold">1位:</span>
                            <span class="truncate max-w-[65px]">${escapeHtml(country.topSong)}</span>
                        </div>
                        <div class="w-5 h-5 rounded-full bg-spotify-green/30 border-2 border-spotify-green pulse-glow-pin flex items-center justify-center -mt-2">
                            <div class="w-2 h-2 rounded-full bg-spotify-green"></div>
                        </div>
                    </div>
                `;

                const customIcon = L.divIcon({
                    html: iconHtml,
                    className: '',
                    iconSize: [80, 40],
                    iconAnchor: [40, 20]
                });

                const marker = L.marker(country.coords, { icon: customIcon }).addTo(map);
                marker.on('click', () => {
                    fetchChart(code, 'now', `🔥 ${country.flag} ${country.name} 今聴かれている曲 Top 10`, 10);
                });
            });

            setTimeout(() => {
                if (map) {
                    map.invalidateSize();
                    map.fitBounds(displayBounds, { padding: [10, 10] });
                }
            }, 300);
        }

        async function fetchChart(countryCode, chartType = 'now', displayTitle = '', limit = 10) {
            const country = COUNTRIES[countryCode] || COUNTRIES['US'];
            
            document.getElementById('sheet-flag').textContent = country.flag;
            document.getElementById('sheet-title').textContent = displayTitle || `${country.name} Top Hits`;

            openSheet();

            const container = document.getElementById('song-list-container');
            container.innerHTML = `
                <div class="flex items-center justify-center py-12 space-x-2">
                    <div class="w-6 h-6 border-2 border-spotify-green border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-xs text-zinc-400">リアルタイム取得中...</span>
                </div>
            `;

            try {
                const res = await fetch(`/api/chart?country=${countryCode}&chartType=${chartType}&limit=${limit}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.tracks && data.tracks.length > 0) {
                        renderTracks(data.tracks);
                        return;
                    }
                }
            } catch (e) {
                console.warn('API error:', e);
            }
        }

        function createFallbackBadgeSVG(rank) {
            let colorStart = '#1DB954', textColor = '#ffffff';
            if (rank === 1) { colorStart = '#FFD700'; textColor = '#000000'; }
            else if (rank === 2) { colorStart = '#E0E0E0'; textColor = '#000000'; }
            else if (rank === 3) { colorStart = '#CD7F32'; textColor = '#ffffff'; }

            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
                <rect width="300" height="300" fill="#181818"/>
                <circle cx="150" cy="150" r="100" fill="${colorStart}"/>
                <text x="150" y="165" font-family="sans-serif" font-size="48" font-weight="bold" fill="${textColor}" text-anchor="middle">No.${rank}</text>
            </svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }

        function renderTracks(tracks) {
            const container = document.getElementById('song-list-container');
            container.innerHTML = tracks.map((t, idx) => {
                const rank = t.rank || (idx + 1);
                const fallbackImg = createFallbackBadgeSVG(rank);
                const imgSrc = t.img || fallbackImg;

                return `
                <div class="flex items-center justify-between p-2.5 rounded-xl bg-zinc-900 border border-zinc-800/80 hover:border-zinc-700 transition-colors">
                    <div class="flex items-center space-x-3 min-w-0 flex-1">
                        <span class="w-6 h-6 rounded flex items-center justify-center text-xs font-extrabold shrink-0 ${rank <= 3 ? 'rank-' + rank : 'rank-other'}">${rank}</span>
                        <img src="${imgSrc}" onerror="this.onerror=null; this.src='${fallbackImg}';" class="w-10 h-10 rounded-lg object-cover bg-zinc-800 shrink-0" />
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-bold text-white truncate">${escapeHtml(t.title)}</h4>
                            <p class="text-[11px] text-zinc-400 truncate">${escapeHtml(t.artist)}</p>
                        </div>
                    </div>
                    <a href="${t.url}" target="_blank" rel="noopener noreferrer" class="w-8 h-8 rounded-full bg-spotify-green/20 text-spotify-green hover:bg-spotify-green hover:text-black transition-colors flex items-center justify-center text-xs ml-2 shrink-0">
                        <i class="fa-solid fa-play"></i>
                    </a>
                </div>
                `;
            }).join('');
        }

        function escapeHtml(str) {
            return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.addEventListener('load', () => {
            initMap();

            document.getElementById('close-sheet-btn').addEventListener('click', (e) => {
                e.stopPropagation();
                closeSheet();
            });
            document.getElementById('sheet-handle').addEventListener('click', closeSheet);
        });

        window.addEventListener('resize', () => {
            if (map) map.invalidateSize();
        });
    </script>
</body>
</html>
